sonar.host.url=https://sonar.murphylearn.com
sonar.projectKey=superset-frontend
sonar.projectName=superset-frontend

sonar.sources=superset-frontend/src
sonar.tests=superset-frontend/spec
sonar.test.inclusions=**/*.test.*,**/*.spec.*,superset-frontend/spec/**

sonar.sourceEncoding=UTF-8

# Large JS/TS codebase: the analysis bridge needs more heap than the default
sonar.javascript.node.maxspace=4096

sonar.exclusions=**/node_modules/**,**/dist/**,**/lib/**,**/esm/**,**/build/**,**/coverage/**,**/__snapshots__/**,**/*.snap,**/vendor/**,**/*.min.js,**/generated/**
